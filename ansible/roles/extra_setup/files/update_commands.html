<h1>VM Update Commands</h1>

1. Open a Terminal session<br>
2. Type in or copy/paste at the <code>$</code> prompt:<br>
<br>
<code> cd ~/training/vm-setup</code><br>
<code> ./update.sh ..</code><br>
<br>
OR (equivalent alternative)<br>
<br>
<code> cd ~/training</code><br>
<code> ./vm-setup/update.sh</code><br>
