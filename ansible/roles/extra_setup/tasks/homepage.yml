---
# Contributes a link to the shared Training-VM homepage set up by
# initial_setup (see roles/initial_setup/tasks/homepage.yml)
#
# Add extra homepage entries
#
- name: Add link to home page
  ansible.builtin.copy:
    src: |
      <li><a href="file://{{ training_vm_homepage_dir }}/pages/{{ item.file }}">{{ item.descriptor }}</a></li>
    dest: "{{ training_vm_homepage_dir }}/links.d/{{ item.link }}"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0644"
  notify: Reassemble Training-VM homepage

- name: Add iocsh commands to page
  become: true
  ansible.builtin.copy:
    src: "{{ item.file }}"
    dest: "{{ training_vm_homepage_dir }}/pages/{{ item.file }}"
    owner: "{{ dev_user }}"
    group: "{{ dev_user }}"
    mode: "0644"
  notify: Reassemble Training-VM homepage

